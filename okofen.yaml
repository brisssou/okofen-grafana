apiVersion: v1
kind: Pod
metadata:
  labels:
    app: okofen
  name: okofen
spec:
  containers:
    - name: grafana
      image: docker.io/grafana/grafana:11.4.0
      env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: grafana
        - name: GF_PATHS_CONFIG
          value: /etc/grafana/grafana.ini
        - name: GF_INSTALL_PLUGINS
          value: frser-sqlite-datasource 4.0.6
      ports:
        - containerPort: 3000
          hostPort: 3000
          protocol: TCP
      volumeMounts:
        - name: grafana-config
          mountPath: /etc/grafana
          readOnly: true
        - name: grafana-provisioning
          mountPath: /etc/grafana/provisioning
          readOnly: true
        - name: okofen-data
          mountPath: /var/lib/grafana/okofen-data
          readOnly: true

  volumes:
    - name: grafana-provisioning
      hostPath:
        path: ./grafana/provisioning
        type: Directory
    - name: grafana-config
      hostPath:
        path: ./grafana/config
        type: Directory
    - name: okofen-data
      hostPath:
        path: ./data
        type: Directory
